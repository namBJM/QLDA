services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: slms
      POSTGRES_USER: slms
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slms -d slms']
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/slms?currentSchema=m01
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD}
      APPROVAL_THRESHOLD: ${APPROVAL_THRESHOLD:-1000}
      EVIDENCE_DIR: /app/data/evidence
    volumes: ['evidence-data:/app/data/evidence']
    depends_on:
      db: { condition: service_healthy }
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:8088:80']
    depends_on: [backend]
volumes:
  postgres-data:
  evidence-data:
